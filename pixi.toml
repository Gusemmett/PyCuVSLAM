[workspace]
authors = ["AngusEmmett <gusemmett@gmail.com>"]
channels = ["nvidia", "conda-forge"]
name = "PyCuVSLAM"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]


[dependencies]
cuda-version = "12.6"
"cuda-toolkit" = { version = "12.6.*", channel = "nvidia" }
python = "3.10.*"
numpy = ">=1.24,<2"
scipy = "1.14.1.*"
pillow = "11.1.0.*"
pyyaml = "6.0.2.*"
rerun-sdk = "0.23.*"
opencv = ">=4.8.0,<5"
pip = "*"

[pypi-dependencies]
depthai = ">=2.30.0.0, <3"
